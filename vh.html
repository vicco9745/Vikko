<h2 id="showmsg"></h2>

<script>



function checkMessage(){

var savedDate = localStorage.getItem("salaryDate");
var savedMsg = localStorage.getItem("salaryMsg");

var today = new Date().toISOString().split("T")[0];

if(today == savedDate){
document.getElementById("showmsg").innerHTML = savedMsg;
}

}

checkMessage();

setInterval(checkMessage,5000);

</script>

  <p></p>
  
  <div id="messages"></div>
  
</body>
